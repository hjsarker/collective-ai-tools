name: Refresh automotive data and deploy
on:
  schedule:
    - cron: '27 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: auto-pulse-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Update global IEA/OWID datasets
        run: python -m pipeline.global_ev --refresh
        continue-on-error: true
      - name: Update German monthly figures
        run: python -m pipeline.main
        continue-on-error: true
      - name: Validate data before publishing
        run: |
          python -m pipeline.global_ev
          python -m pipeline.main --offline
          python -m pytest -q
          python build_standalone.py
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global.json data/global_analytics.csv data/market.json data/registration_analytics.csv web/global.json web/market.json deploy-index.html
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified automotive datasets"
            git pull --rebase
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
